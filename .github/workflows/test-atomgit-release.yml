name: Test AtomGit Release Sync

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建并同步的预发布 tag'
        required: true
        default: 'v2.23.8-alpha'
        type: string

permissions:
  contents: write

jobs:
  test-atomgit-release:
    name: Test AtomGit Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create GitHub prerelease and small test asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p atomgit-test-assets
          asset_file="atomgit-test-assets/atomgit-link-test.txt"
          printf 'GitHub and AtomGit Release upload test\ntag=%s\nrun_id=%s\n' "$TAG_NAME" "$GITHUB_RUN_ID" \
            > "$asset_file"

          if ! git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            git tag -a "$TAG_NAME" -m "$TAG_NAME"
          fi
          git push origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --prerelease
            gh release upload "$TAG_NAME" "$asset_file" --clobber
          else
            gh release create "$TAG_NAME" "$asset_file" \
              --title "$TAG_NAME" \
              --notes "AtomGit tag 与 Release 附件同步链路测试。" \
              --prerelease
          fi

          gh release view "$TAG_NAME" --json tagName,name,body,isPrerelease,isDraft,url \
            > atomgit-test-release.json
          ls -lah atomgit-test-assets

      - name: Trigger AtomGit pull mirror
        id: atomgit_mirror
        continue-on-error: true
        env:
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          ATOMGIT_PROJECT_ID: '10496882'
        run: |
          set -euo pipefail
          echo "AtomGit project ID: ${ATOMGIT_PROJECT_ID}"

          status="$(curl --show-error --silent --request POST \
            --output atomgit-mirror-response.txt \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${ATOMGIT_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/plain, */*" \
            --header "Origin: https://atomgit.com" \
            --header "Referer: https://atomgit.com/" \
            --header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36" \
            --header "X-App-Version: 0" \
            --header "X-Platform: web" \
            --header "X-Device-Type: Linux" \
            --header "X-App-Channel: gitcode-fe" \
            --header "X-Network-Type: 4g" \
            --header "X-OS-Version: Linux" \
            --header "X-Device-ID: github-actions-${GITHUB_RUN_ID}" \
            --data '{}' \
            "https://web-api.atomgit.com/api/v2/projects/${ATOMGIT_PROJECT_ID}/sync_remote_mirror"
          )"

          echo "AtomGit mirror HTTP status: ${status}"
          echo "AtomGit mirror response:"
          cat atomgit-mirror-response.txt
          echo

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            exit 1
          fi

      - name: Publish small test asset to AtomGit Release
        env:
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          ATOMGIT_OWNER: ${{ vars.ATOMGIT_OWNER }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_ASSETS_DIR: atomgit-test-assets
          GITHUB_RELEASE_JSON: atomgit-test-release.json
        run: node .github/scripts/sync-atomgit-release.mjs

      - name: Report mirror trigger failure
        if: always() && steps.atomgit_mirror.outcome == 'failure'
        run: |
          echo "AtomGit Release 上传链路已执行，但镜像立即同步接口调用失败。"
          exit 1
