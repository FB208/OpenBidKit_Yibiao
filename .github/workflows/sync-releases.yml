name: Sync Releases to Mirrors

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要同步的 tag，例如 v2.0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish-atomgit-release:
    name: Publish AtomGit Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read GitHub Release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release view "$TAG_NAME" --json tagName,name,body,isPrerelease,isDraft,url > atomgit-release.json

      - name: Create or update AtomGit Release
        env:
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          ATOMGIT_OWNER: ${{ vars.ATOMGIT_OWNER }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO }}
          TAG_NAME: ${{ inputs.tag_name }}
          GITHUB_RELEASE_JSON: atomgit-release.json
        run: node .github/scripts/sync-atomgit-release.mjs

  publish-gitee-release:
    name: Publish R2 and Gitee Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Gitee tag
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: node .github/scripts/sync-gitee-release.mjs --check-tag

      - name: Read GitHub Release metadata
        id: github_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --json tagName,name,body,isPrerelease,isDraft,url > github-release.json
          echo "is_prerelease=$(jq -r '.isPrerelease' github-release.json)" >> "$GITHUB_OUTPUT"

      - name: Install R2 publish tooling
        if: steps.github_release.outputs.is_prerelease != 'true'
        run: npm install --no-save --package-lock=false @aws-sdk/client-s3

      - name: Download GitHub Release assets
        if: steps.github_release.outputs.is_prerelease != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets --clobber
          ls -lah release-assets

      - name: Publish release assets to Cloudflare R2
        if: steps.github_release.outputs.is_prerelease != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'openbidkit' }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'release' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
        run: node .github/scripts/publish-r2-release.mjs

      - name: Create or update Gitee Release
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'release' }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_ASSETS_DIR: release-assets
          GITHUB_RELEASE_JSON: github-release.json
        run: node .github/scripts/sync-gitee-release.mjs
