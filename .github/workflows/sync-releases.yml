name: Finalize Mirror Releases

on:
  workflow_call:
    inputs:
      tag_name:
        description: '已完成各平台直接上传的 tag'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  finalize-releases:
    name: Publish update manifests and release links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install publish tooling
        run: npm install --no-save --package-lock=false @aws-sdk/client-s3 js-yaml@4.1.1

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-metadata-*
          path: release-metadata
          merge-multiple: false

      - name: Merge update manifests
        run: |
          shopt -s nullglob
          x64_manifests=(release-metadata/release-metadata-macos-x64/*-mac.yml)
          arm64_manifests=(release-metadata/release-metadata-macos-arm64/*-mac.yml)
          windows_manifests=(release-metadata/release-metadata-windows/*.yml)
          if [ ${#x64_manifests[@]} -ne 1 ] || [ ${#arm64_manifests[@]} -ne 1 ] || [ ${#windows_manifests[@]} -eq 0 ]; then
            echo "Expected update manifests from all three platforms."
            exit 1
          fi
          manifest_name="$(basename "${x64_manifests[0]}")"
          if [ "$manifest_name" != "$(basename "${arm64_manifests[0]}")" ]; then
            echo "macOS update manifest names do not match."
            exit 1
          fi
          mkdir -p release-manifests
          cp "${windows_manifests[@]}" release-manifests/
          node client/scripts/merge-mac-update-manifests.cjs \
            "${x64_manifests[0]}" "${arm64_manifests[0]}" "release-manifests/$manifest_name"

      - name: Prepare release publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          node .github/scripts/sync-atomgit-release.mjs --configure-hosts
          gh release view "$TAG_NAME" --json tagName,name,body,isPrerelease,isDraft,url > github-release.json

      - name: Publish manifests and finalize mirrors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          ATOMGIT_OWNER: ${{ vars.ATOMGIT_OWNER }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'openbidkit' }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'release' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          TAG_NAME: ${{ inputs.tag_name }}
          GITHUB_RELEASE_JSON: github-release.json
          RELEASE_METADATA_DIR: release-metadata
          RELEASE_ASSET_MANIFEST: release-assets.json
        run: |
          shopt -s nullglob
          manifests=(release-manifests/*.yml)
          gh release upload "$TAG_NAME" "${manifests[@]}" --clobber &
          github_pid=$!
          node .github/scripts/sync-atomgit-release.mjs --upload "${manifests[@]}" &
          atomgit_pid=$!
          (
            node .github/scripts/sync-gitee-release.mjs --check-tag
            node .github/scripts/publish-r2-release.mjs --finalize "${manifests[@]}"
            node .github/scripts/sync-gitee-release.mjs
          ) &
          r2_gitee_pid=$!
          status=0
          for upload_pid in "$github_pid" "$atomgit_pid" "$r2_gitee_pid"; do
            if ! wait "$upload_pid"; then status=1; fi
          done
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          node .github/scripts/sync-atomgit-release.mjs --finalize
